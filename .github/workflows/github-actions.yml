name: CI

on:
  push:
    branches: [ main, master, a3-source ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Assignment 4 Buildroot Configuration
        run: |
          if [ -f "base_external/configs/aesd_qemu_defconfig" ]; then
            echo "Checking Buildroot configurations..."
            grep "BR2_PACKAGE_AESD_ASSIGNMENTS=y" base_external/configs/aesd_qemu_defconfig
            grep "BR2_PACKAGE_DROPBEAR=y" base_external/configs/aesd_qemu_defconfig
            grep "BR2_TARGET_GENERIC_ROOT_PASSWD=\"root\"" base_external/configs/aesd_qemu_defconfig
            test -x clean.sh
            test -f base_external/package/aesd-assignments/aesd-assignments.mk
            echo "All Assignment 4 Part 2 Buildroot checks PASSED!"
          elif [ -f "unit-test.sh" ]; then
            echo "Running Unit Tests..."
            git submodule update --init --recursive
            ./unit-test.sh
          fi
